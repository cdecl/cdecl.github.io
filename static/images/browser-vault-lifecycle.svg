<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-locked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="grad-unlocked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="400" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="425" y="32" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">브라우저 금고(Vault) 수명주기 및 메모리 휘발 보호</text>
  <text x="425" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Locked (IndexedDB Ciphertext) ⇄ Unlocked (Volatile RAM) ⇄ Auto-Lock Zeroization</text>

  <!-- 3 Stages Grid -->
  <!-- 1. Locked State -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="235" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="15" y="15" width="205" height="34" rx="6" fill="#21262d"/>
    <text x="117" y="37" fill="#8b949e" font-size="13" font-weight="bold" text-anchor="middle">🔒 1. 평상시: 잠금 (Locked)</text>

    <!-- Content -->
    <g transform="translate(15, 65)">
      <rect width="205" height="65" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="102" y="24" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">IndexedDB 로컬 스토리지</text>
      <text x="102" y="42" fill="#8b949e" font-size="10" text-anchor="middle">암호화된 외계어 바이너리만 저장</text>
      <text x="102" y="56" fill="#7ee787" font-size="9" text-anchor="middle">(디스크에 복호화 키 일절 없음)</text>
    </g>

    <text x="117" y="160" fill="#8b949e" font-size="11" text-anchor="middle">디바이스 전원이 꺼지거나</text>
    <text x="117" y="178" fill="#8b949e" font-size="11" text-anchor="middle">스토리지가 통째로 복사되어도</text>
    <text x="117" y="196" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">해독 불가 상태 유지</text>
  </g>

  <!-- Transition Arrow 1: Unlock -->
  <g transform="translate(275, 175)">
    <path d="M 5 0 L 45 0" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="25" y="-12" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">마스터 비밀번호 입력</text>
    <text x="25" y="18" fill="#8b949e" font-size="9" text-anchor="middle">(KDF 키 도출)</text>
  </g>

  <!-- 2. Unlocked State -->
  <g transform="translate(325, 80)" filter="url(#shadow)">
    <rect width="240" height="240" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.8"/>
    <rect x="15" y="15" width="210" height="34" rx="6" fill="#238636"/>
    <text x="120" y="37" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🔓 2. 사용 중: 잠금 해제</text>

    <!-- Content -->
    <g transform="translate(15, 65)">
      <rect width="210" height="65" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1"/>
      <text x="105" y="24" fill="#aff5b4" font-size="11" font-weight="bold" text-anchor="middle">휘발성 메모리 (Secure RAM)</text>
      <text x="105" y="42" fill="#e6edf3" font-size="10" text-anchor="middle">OS 격리 환경에서 평문 복호화</text>
      <text x="105" y="56" fill="#58a6ff" font-size="9" text-anchor="middle">Web Crypto API (`crypto.subtle`)</text>
    </g>

    <text x="120" y="160" fill="#c9d1d9" font-size="11" text-anchor="middle">웹사이트 로그인 폼 방문 시</text>
    <text x="120" y="178" fill="#56d364" font-size="11" font-weight="bold" text-anchor="middle">안전한 자동 완성 (Autofill)</text>
    <text x="120" y="196" fill="#8b949e" font-size="10" text-anchor="middle">외부 스크립트 접근 격리(DOM 차단)</text>
  </g>

  <!-- Transition Arrow 2: Auto-Lock -->
  <g transform="translate(565, 175)">
    <path d="M 5 0 L 45 0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <text x="25" y="-12" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">타임아웃 (15분)</text>
    <text x="25" y="18" fill="#8b949e" font-size="9" text-anchor="middle">or 브라우저 종료</text>
  </g>

  <!-- 3. Memory Zeroization / Locked Again -->
  <g transform="translate(615, 80)" filter="url(#shadow)">
    <rect width="200" height="240" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="34" rx="6" fill="#21262d"/>
    <text x="100" y="37" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">🛡️ 3. 메모리 즉시 소거</text>

    <!-- Content -->
    <g transform="translate(15, 65)">
      <rect width="170" height="65" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
      <text x="85" y="24" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Zeroization (증발)</text>
      <text x="85" y="42" fill="#e6edf3" font-size="10" text-anchor="middle">RAM의 열쇠와 평문을 0으로 덮어씀</text>
      <text x="85" y="56" fill="#ff7b72" font-size="9" text-anchor="middle">(메모리 덤프 공격 방어)</text>
    </g>

    <text x="100" y="160" fill="#8b949e" font-size="11" text-anchor="middle">흔적 없이 완전 초기화</text>
    <text x="100" y="178" fill="#8b949e" font-size="11" text-anchor="middle">다시 열려면 마스터 암호</text>
    <text x="100" y="196" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">재입력 필수</text>
  </g>

  <!-- Bottom Notice -->
  <text x="425" y="355" fill="#8b949e" font-size="11" text-anchor="middle">💡 비밀번호 관리자는 암호 해제 키를 절대 디스크에 영구 저장하지 않으며, 오직 잠금 해제 세션 동안에만 휘발성 RAM에 보관합니다.</text>
</svg>
