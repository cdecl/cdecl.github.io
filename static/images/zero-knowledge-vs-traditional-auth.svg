<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="grad-safe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="425" y="32" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">전통적인 웹사이트 방식 vs 영지식 암호화 (Zero-Knowledge) 아키텍처</text>
  <text x="425" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Server-Side Knowledge vs Client-Side End-to-End Encryption</text>

  <!-- Left: Traditional Website -->
  <g transform="translate(30, 75)">
    <rect width="380" height="255" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="18" y="14" width="344" height="30" rx="6" fill="#21262d"/>
    <text x="190" y="34" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">⚠️ 전통적인 웹사이트 방식 (중앙 집중)</text>

    <!-- Client Box -->
    <g transform="translate(18, 58)" filter="url(#shadow)">
      <rect width="344" height="48" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="172" y="22" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">사용자 기기 (웹 브라우저)</text>
      <text x="172" y="38" fill="#8b949e" font-size="11" text-anchor="middle">비밀번호 원문(Plaintext)을 네트워크로 전송</text>
    </g>

    <!-- Transfer Arrow -->
    <path d="M 190 106 L 190 130" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="190" y="123" fill="#f85149" font-size="10" font-weight="bold" text-anchor="middle">원문 또는 취약 해시 전송</text>

    <!-- Server Box -->
    <g transform="translate(18, 136)" filter="url(#shadow)">
      <rect width="344" height="60" rx="6" fill="#21262d" stroke="#da3633" stroke-width="1"/>
      <text x="172" y="24" fill="#ffa657" font-size="12" font-weight="600" text-anchor="middle">서비스 회사 서버 &amp; 데이터베이스</text>
      <text x="172" y="42" fill="#c9d1d9" font-size="11" text-anchor="middle">서버가 원문 또는 복호화 가능한 데이터를 보관</text>
      <text x="172" y="54" fill="#8b949e" font-size="10" text-anchor="middle">(서버 관리자/내부자가 데이터 열람 가능)</text>
    </g>

    <!-- Consequence Note -->
    <rect x="18" y="206" width="344" height="34" rx="4" fill="#321014" stroke="#da3633" stroke-width="0.8"/>
    <text x="190" y="224" fill="#ff7b72" font-size="10.5" font-weight="bold" text-anchor="middle">🚨 서버가 침해당하면 내 비밀번호도 통째로 탈취됨!</text>
  </g>

  <!-- Right: Zero-Knowledge -->
  <g transform="translate(440, 75)">
    <rect width="380" height="255" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect x="18" y="14" width="344" height="30" rx="6" fill="#21262d"/>
    <text x="190" y="34" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">🛡️ 영지식 암호화 방식 (Zero-Knowledge)</text>

    <!-- Client Box -->
    <g transform="translate(18, 58)" filter="url(#shadow)">
      <rect width="344" height="48" rx="6" fill="#21262d" stroke="#238636" stroke-width="1.2"/>
      <text x="172" y="22" fill="#56d364" font-size="12" font-weight="bold" text-anchor="middle">사용자 기기 (End-to-End 단말)</text>
      <text x="172" y="38" fill="#e6edf3" font-size="11" text-anchor="middle">기기 안에서 마스터 키로 완벽 암호화(Ciphertext 변환)</text>
    </g>

    <!-- Transfer Arrow -->
    <path d="M 190 106 L 190 130" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="190" y="123" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">오직 암호화된 볼트 블롭만 전송</text>

    <!-- Server Box -->
    <g transform="translate(18, 136)" filter="url(#shadow)">
      <rect width="344" height="60" rx="6" fill="#21262d" stroke="#238636" stroke-width="1"/>
      <text x="172" y="24" fill="#7ee787" font-size="12" font-weight="600" text-anchor="middle">서비스 회사 클라우드 저장소</text>
      <text x="172" y="42" fill="#c9d1d9" font-size="11" text-anchor="middle">열쇠가 없는 '잠긴 외계어 덩어리'만 대리 보관</text>
      <text x="172" y="54" fill="#8b949e" font-size="10" text-anchor="middle">(서버 운영자/해커도 복호화 열쇠가 없어 내용 열람 불가)</text>
    </g>

    <!-- Consequence Note -->
    <rect x="18" y="206" width="344" height="34" rx="4" fill="#0d2818" stroke="#238636" stroke-width="0.8"/>
    <text x="190" y="224" fill="#7ee787" font-size="10.5" font-weight="bold" text-anchor="middle">✅ 서버가 통째로 털려도 복호화 열쇠가 없어 안전함!</text>
  </g>
</svg>
