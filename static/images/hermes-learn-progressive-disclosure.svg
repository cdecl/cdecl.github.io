<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="grad-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="400" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="425" y="32" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">스킬 점진적 공개 (Progressive Disclosure) 아키텍처</text>
  <text x="425" y="52" fill="#8b949e" font-size="12" text-anchor="middle">토큰 낭비 없는 경량 메타데이터 인덱싱 &amp; 온디맨드 세부 지침 로딩</text>

  <!-- Level 1: Everyday Dialogue (Lightweight Index) -->
  <g transform="translate(60, 75)" filter="url(#shadow)">
    <rect width="730" height="115" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <rect x="18" y="12" width="694" height="26" rx="4" fill="url(#grad-l1)"/>
    <text x="365" y="29" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1단계: 일상 대화 시 (경량 메타데이터 인덱스만 프롬프트 주입)</text>

    <!-- Code/List Preview -->
    <g transform="translate(30, 48)">
      <text x="0" y="18" fill="#58a6ff" font-family="monospace" font-size="11" font-weight="bold">• daily-tech-digest:</text>
      <text x="160" y="18" fill="#8b949e" font-size="11">Search tech news sources, filter top updates, and write a digest. (50-100 토큰)</text>

      <text x="0" y="38" fill="#58a6ff" font-family="monospace" font-size="11" font-weight="bold">• pdf-invoice-parser:</text>
      <text x="160" y="38" fill="#8b949e" font-size="11">Extract structured data from PDF receipts and append to CSV.</text>

      <text x="0" y="58" fill="#58a6ff" font-family="monospace" font-size="11" font-weight="bold">• git-pr-summarizer:</text>
      <text x="160" y="58" fill="#8b949e" font-size="11">Analyze changes across git branches and draft release notes.</text>
    </g>
  </g>

  <!-- Trigger Event Arrow -->
  <g transform="translate(180, 200)">
    <path d="M 245 0 L 245 35" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="50" y="8" width="390" height="22" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1"/>
    <text x="245" y="23" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">사용자 트리거 입력: "오늘자 주요 AI 뉴스 브리핑 파일 만들어줘"</text>
  </g>

  <!-- Level 2: Skill Identified & On-Demand Full Load -->
  <g transform="translate(60, 250)" filter="url(#shadow)">
    <rect width="730" height="120" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.8"/>
    <rect x="18" y="12" width="694" height="26" rx="4" fill="url(#grad-l2)"/>
    <text x="365" y="29" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2단계: 관련 스킬 식별 시 (온디맨드 세부 지침 및 리소스 동적 로드)</text>

    <g transform="translate(30, 52)">
      <text x="0" y="16" fill="#3fb950" font-size="12" font-weight="bold">🎯 목적 일치도 판정:</text>
      <text x="140" y="16" fill="#c9d1d9" font-size="11.5">사용자 프롬프트와 'daily-tech-digest'의 메타데이터가 완벽 부합함을 확인</text>

      <text x="0" y="38" fill="#56d364" font-size="12" font-weight="bold">📂 SKILL.md 전체 로드:</text>
      <text x="140" y="38" fill="#c9d1d9" font-size="11.5">해당 디렉토리의 전체 마크다운 가이드와 scripts/ 실행 스크립트를 즉시 컨텍스트에 주입</text>

      <text x="0" y="60" fill="#aff5b4" font-size="12" font-weight="bold">⚡ 무손실 정밀 실행:</text>
      <text x="140" y="60" fill="#c9d1d9" font-size="11.5">평소 수십 개 스킬을 보유해도 토큰 소비 없이 필요 시점에만 전문가 수준으로 전환!</text>
    </g>
  </g>
</svg>
