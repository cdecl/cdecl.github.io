<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-input" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="grad-engine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="grad-skill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="440" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="425" y="32" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">Hermes Agent: /learn 스킬 자동 생성 파이프라인</text>
  <text x="425" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Interactive Session Log &amp; Documentation → Reusable Open Standard SKILL.md</text>

  <!-- Stage 1: Input Sources -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <rect width="650" height="85" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.2"/>
    <rect x="18" y="12" width="614" height="26" rx="4" fill="url(#grad-input)"/>
    <text x="325" y="29" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">📥 학습 소스 (Input Sources)</text>

    <!-- Details -->
    <text x="35" y="58" fill="#c9d1d9" font-size="11.5">• 방금 성공적으로 완료한 복합 업무 세션 대화 로그 (도구 호출 시퀀스)</text>
    <text x="35" y="76" fill="#8b949e" font-size="11.5">• 사용자가 입력한 단계별 업무 매뉴얼 / 메모 또는 특정 작업 절차 웹 문서</text>
  </g>

  <!-- Arrow down to /learn Engine -->
  <path d="M 425 160 L 425 185" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Hermes /learn Engine -->
  <g transform="translate(100, 190)" filter="url(#shadow)">
    <rect width="650" height="115" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.8"/>
    <rect x="18" y="12" width="614" height="26" rx="4" fill="url(#grad-engine)"/>
    <text x="325" y="29" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">⚙️ Hermes /learn 지식 추출 &amp; 정형화 엔진</text>

    <!-- 3 Internal Steps -->
    <g transform="translate(35, 52)">
      <text x="0" y="16" fill="#bc8cff" font-size="11" font-weight="bold">1. 트리거 추출:</text>
      <text x="105" y="16" fill="#e6edf3" font-size="11">작업 목적과 실행 시점 조건(When to Use) 자연어 메타데이터 규정</text>

      <text x="0" y="38" fill="#58a6ff" font-size="11" font-weight="bold">2. 워크플로우 정형화:</text>
      <text x="105" y="38" fill="#e6edf3" font-size="11">browser, terminal, file_write 등 툴 호출 파라미터 및 오류 처리 절차 일반화</text>

      <text x="0" y="60" fill="#7ee787" font-size="11" font-weight="bold">3. 오픈 표준 규격화:</text>
      <text x="105" y="60" fill="#e6edf3" font-size="11">agentskills.io 호환 YAML Frontmatter 및 행동 규칙(Rules) 자동 편성</text>
    </g>
  </g>

  <!-- Arrow down to Skill Artifact -->
  <path d="M 425 305 L 425 330" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="330" y="310" width="190" height="18" rx="4" fill="#0d1117" stroke="#238636" stroke-width="0.8"/>
  <text x="425" y="322" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">skill_manage 내부 도구 연동</text>

  <!-- Stage 3: Generated SKILL.md Artifact -->
  <g transform="translate(100, 335)" filter="url(#shadow)">
    <rect width="650" height="80" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect x="18" y="12" width="614" height="26" rx="4" fill="url(#grad-skill)"/>
    <text x="325" y="29" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">📄 ~/.hermes/skills/&lt;skill-name&gt;/SKILL.md</text>

    <!-- Details -->
    <text x="325" y="56" fill="#aff5b4" font-size="11" font-weight="600" text-anchor="middle">인간과 에이전트가 함께 열람하고 Git으로 버전 관리할 수 있는 순수 마크다운 자산</text>
    <text x="325" y="71" fill="#8b949e" font-size="10.5" text-anchor="middle">필요 시 scripts/ 및 references/ 보조 파일과 함께 온디맨드로 즉각 활성화</text>
  </g>
</svg>
