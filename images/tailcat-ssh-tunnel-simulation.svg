<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="ssh-client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="ssh-server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="ssh-tunnel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <filter id="ssh-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f0883e"/>
    </marker>
  </defs>

  <!-- Container -->
  <rect width="860" height="440" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="430" y="38" fill="#f0f6fc" font-size="19" font-weight="bold" text-anchor="middle">Tailcat 기반 SSH (Port 22) 안전 접속 터널링 흐름</text>
  <text x="430" y="60" fill="#8b949e" font-size="12" text-anchor="middle">기존 SSH 키 인증 체계 + Tailcat WireGuard P2P 터널 결합</text>

  <!-- Left: Client Workstation Box -->
  <g transform="translate(40, 85)" filter="url(#ssh-shadow)">
    <rect width="280" height="315" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="280" height="36" rx="10" fill="url(#ssh-client-grad)"/>
    <rect y="26" width="280" height="10" fill="#1f6feb"/>
    <text x="140" y="23" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Local Workstation (클라이언트)</text>

    <!-- Sub Box 1: SSH Client & Existing Key -->
    <rect x="15" y="52" width="250" height="88" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="25" y="73" fill="#58a6ff" font-size="12" font-weight="bold">OpenSSH Client</text>
    <text x="25" y="93" fill="#e6edf3" font-size="11">`ssh -p 2222 user@localhost`</text>
    <rect x="25" y="104" width="230" height="24" rx="4" fill="#0d1117" stroke="#388bfd" stroke-width="0.8"/>
    <text x="35" y="120" fill="#79c0ff" font-size="10">🔑 기존 키: `~/.ssh/id_ed25519`</text>

    <!-- Downward Arrow within Client -->
    <path d="M 140 142 L 140 168" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="148" y="158" fill="#8b949e" font-size="10">localhost:2222 바인딩</text>

    <!-- Sub Box 2: Tailcat Client Forwarder -->
    <rect x="15" y="172" width="250" height="110" rx="6" fill="#1c242c" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="25" y="194" fill="#f0f6fc" font-size="12" font-weight="bold">Tailcat Client Process</text>
    <text x="25" y="213" fill="#aff5b4" font-size="11">`tailcat forward 2222:22 tc...`</text>
    <text x="25" y="232" fill="#8b949e" font-size="10">(또는 SSH ProxyCommand 연동)</text>

    <rect x="25" y="246" width="230" height="24" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="262" fill="#d2a8ff" font-size="10">WireGuard 암호화 패킷 캡슐화</text>
  </g>

  <!-- Right: Target Server Box -->
  <g transform="translate(540, 85)" filter="url(#ssh-shadow)">
    <rect width="280" height="315" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="280" height="36" rx="10" fill="url(#ssh-server-grad)"/>
    <rect y="26" width="280" height="10" fill="#238636"/>
    <text x="140" y="23" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Remote Target Server (서버)</text>

    <!-- Sub Box 1: Tailcat Server Listener -->
    <rect x="15" y="52" width="250" height="110" rx="6" fill="#1c2420" stroke="#3fb950" stroke-width="1.2"/>
    <text x="25" y="74" fill="#f0f6fc" font-size="12" font-weight="bold">Tailcat Server Process</text>
    <text x="25" y="93" fill="#aff5b4" font-size="11">`tailcat serve 22`</text>
    <text x="25" y="112" fill="#8b949e" font-size="10">Tailcat 주소(`tc...`) 발급 및 대기</text>

    <rect x="25" y="126" width="230" height="24" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="142" fill="#d2a8ff" font-size="10">패킷 복호화 후 127.0.0.1:22 전달</text>

    <!-- Downward Arrow within Server -->
    <path d="M 140 164 L 140 190" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="148" y="180" fill="#8b949e" font-size="10">Local Loopback (22)</text>

    <!-- Sub Box 2: System SSHD & authorized_keys -->
    <rect x="15" y="194" width="250" height="88" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="25" y="215" fill="#3fb950" font-size="12" font-weight="bold">System `sshd` Daemon</text>
    <text x="25" y="235" fill="#e6edf3" font-size="11">포트 22 수신 대기 (Localhost)</text>
    <rect x="25" y="246" width="230" height="24" rx="4" fill="#0d1117" stroke="#2ea043" stroke-width="0.8"/>
    <text x="35" y="262" fill="#7ee787" font-size="10">🔒 검증: `~/.ssh/authorized_keys`</text>
  </g>

  <!-- Center: WireGuard Encrypted Tunnel Flow -->
  <g transform="translate(330, 195)" filter="url(#ssh-shadow)">
    <!-- Tunnel Pipe Shape -->
    <rect width="200" height="80" rx="10" fill="#161b22" stroke="url(#ssh-tunnel-grad)" stroke-width="2"/>
    <text x="100" y="28" fill="#e3b341" font-size="12" font-weight="bold" text-anchor="middle">WireGuard P2P 터널</text>
    <text x="100" y="48" fill="#58a6ff" font-size="11" text-anchor="middle">종단간 암호화 (E2EE)</text>
    <text x="100" y="66" fill="#8b949e" font-size="10" text-anchor="middle">NAT 통과 / DERP 폴백</text>
  </g>

  <!-- Left-to-Center Connection Path -->
  <path d="M 270 235 L 330 235" stroke="#f0883e" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- Center-to-Right Connection Path -->
  <path d="M 530 235 L 545 235 L 545 105 L 555 105" stroke="#f0883e" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Bottom Summary Note -->
  <g transform="translate(40, 412)">
    <text x="430" y="10" fill="#8b949e" font-size="11" text-anchor="middle">
      ✔ 별도의 Tailcat 키 생성 없이, 기존에 사용 중인 SSH 키 페어(`id_ed25519` ↔ `authorized_keys`)로 완벽한 보안 인증 수행
    </text>
  </g>
</svg>
