<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-tmux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <linearGradient id="grad-herdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="35" fill="#f0f6fc" font-size="20" font-weight="bold" text-anchor="middle">Traditional Tmux vs Agent-Aware Herdr</text>
  <text x="400" y="55" fill="#8b949e" font-size="13" text-anchor="middle">Architectural Comparison for AI Coding Agents</text>

  <!-- Left: Traditional Tmux -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="340" height="360" rx="10" fill="url(#grad-tmux)" stroke="#484f58" stroke-width="1.5"/>
    <text x="170" y="30" fill="#f85149" font-size="15" font-weight="bold" text-anchor="middle">🖥️ Traditional Tmux Environment</text>
    <text x="170" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Blind Byte Stream Transfer</text>

    <!-- Tmux Server Box -->
    <g transform="translate(20, 70)">
      <rect width="300" height="235" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="150" y="25" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">tmux server (Pty streams only)</text>
      
      <!-- Panes -->
      <g transform="translate(15, 40)">
        <rect width="270" height="45" rx="4" fill="#21262d" stroke="#f85149" stroke-width="0.8"/>
        <text x="135" y="20" fill="#ff7b72" font-size="11" font-weight="bold" text-anchor="middle">Pane 1: bash (Claude Code)</text>
        <text x="135" y="34" fill="#8b949e" font-size="10" text-anchor="middle">Status: Unknown / Blind</text>
      </g>
      <g transform="translate(15, 95)">
        <rect width="270" height="45" rx="4" fill="#21262d" stroke="#f85149" stroke-width="0.8"/>
        <text x="135" y="20" fill="#ff7b72" font-size="11" font-weight="bold" text-anchor="middle">Pane 2: bash (Codex)</text>
        <text x="135" y="34" fill="#8b949e" font-size="10" text-anchor="middle">Status: Prompt waiting? (Unknown)</text>
      </g>
      <g transform="translate(15, 150)">
        <rect width="270" height="45" rx="4" fill="#21262d" stroke="#f85149" stroke-width="0.8"/>
        <text x="135" y="20" fill="#ff7b72" font-size="11" font-weight="bold" text-anchor="middle">Pane 3: bash (Test)</text>
        <text x="135" y="34" fill="#8b949e" font-size="10" text-anchor="middle">Status: Finished? (Unknown)</text>
      </g>
    </g>

    <text x="170" y="335" fill="#ff7b72" font-size="11" text-anchor="middle">⚠️ Developer must manually check every pane</text>
  </g>

  <!-- Right: Herdr Environment -->
  <g transform="translate(420, 80)" filter="url(#shadow)">
    <rect width="340" height="360" rx="10" fill="url(#grad-tmux)" stroke="#238636" stroke-width="1.5"/>
    <text x="170" y="30" fill="#56d364" font-size="15" font-weight="bold" text-anchor="middle">🚀 Herdr Agent-Aware Environment</text>
    <text x="170" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Daemon Runtime &amp; Socket API</text>

    <!-- Herdr Server Box -->
    <g transform="translate(20, 70)">
      <rect width="300" height="235" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1"/>
      <text x="150" y="25" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Herdr Server &amp; Daemon (Agent Runtime)</text>
      
      <!-- Panes -->
      <g transform="translate(15, 40)">
        <rect width="270" height="45" rx="4" fill="#21262d" stroke="#2ea043" stroke-width="0.8"/>
        <text x="135" y="20" fill="#56d364" font-size="11" font-weight="bold" text-anchor="middle">Pane 1: [Claude Code]</text>
        <text x="135" y="34" fill="#aff5b4" font-size="10" text-anchor="middle">⚡ Working (Generating Tokens)</text>
      </g>
      <g transform="translate(15, 95)">
        <rect width="270" height="45" rx="4" fill="#21262d" stroke="#f0883e" stroke-width="0.8"/>
        <text x="135" y="20" fill="#ffa657" font-size="11" font-weight="bold" text-anchor="middle">Pane 2: [Codex]</text>
        <text x="135" y="34" fill="#ffd8a8" font-size="10" text-anchor="middle">⏸️ Blocked (Awaiting Approval -> OS Alert)</text>
      </g>
      <g transform="translate(15, 150)">
        <rect width="270" height="45" rx="4" fill="#21262d" stroke="#2ea043" stroke-width="0.8"/>
        <text x="135" y="20" fill="#56d364" font-size="11" font-weight="bold" text-anchor="middle">Pane 3: [Unit Test]</text>
        <text x="135" y="34" fill="#aff5b4" font-size="10" text-anchor="middle">✅ Done (Successfully Completed)</text>
      </g>
    </g>

    <text x="170" y="335" fill="#56d364" font-size="11" text-anchor="middle">✨ Socket API allows direct agent cross-spawning</text>
  </g>

  <!-- Bottom footer -->
  <text x="400" y="475" fill="#8b949e" font-size="12" text-anchor="middle">Herdr replaces blind byte streams with structured agent lifecycle tracking and open RPC control.</text>

</svg>
