<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-rag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="grad-wiki" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <linearGradient id="grad-llm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="425" y="32" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">RAG vs LLM Wiki: Architecture &amp; Synthesis Timing</text>
  <text x="425" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Episodic Zero-Base Retrieval vs Compounding Markdown Knowledge Base</text>

  <!-- Top Section: Traditional RAG -->
  <g transform="translate(30, 75)">
    <rect width="790" height="170" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="20" y="24" fill="#f85149" font-size="13" font-weight="bold">전통적인 RAG 방식 (Traditional RAG) — 제로베이스 단발성 검색</text>

    <!-- Flow: Raw -> Chunk -> Vector DB -> Query -> Ephemeral LLM Synthesis -->
    <!-- Box 1: Ingest & Embed -->
    <g transform="translate(20, 42)" filter="url(#shadow)">
      <rect width="210" height="60" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="105" y="24" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">원문 수집 (Raw Ingest)</text>
      <text x="105" y="42" fill="#8b949e" font-size="11" text-anchor="middle">텍스트 청킹 &amp; 벡터 임베딩 DB</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 230 72 L 275 72" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <!-- Box 2: Query & Top-K -->
    <g transform="translate(285, 42)" filter="url(#shadow)">
      <rect width="210" height="60" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="105" y="24" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">질의 시점 유사도 검색</text>
      <text x="105" y="42" fill="#8b949e" font-size="11" text-anchor="middle">Top-K 청크 파편 추출 (Query)</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 495 72 L 540 72" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <!-- Box 3: LLM Synthesis & Ephemeral Answer -->
    <g transform="translate(550, 42)" filter="url(#shadow)">
      <rect width="215" height="60" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1.2"/>
      <text x="107" y="24" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">프롬프트 임시 종합</text>
      <text x="107" y="42" fill="#e6edf3" font-size="11" text-anchor="middle">답변 후 지식 휘발 (누적 ❌)</text>
    </g>

    <!-- Warning Footer Note -->
    <text x="395" y="145" fill="#8b949e" font-size="11" text-anchor="middle">⚠️ 매 질의마다 청크를 새로 긁어모아 처음부터 종합하므로 지식의 유기적 연결과 복리 성장이 불가능</text>
  </g>

  <!-- Bottom Section: LLM Wiki -->
  <g transform="translate(30, 265)">
    <rect width="790" height="190" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="20" y="24" fill="#3fb950" font-size="13" font-weight="bold">LLM Wiki 방식 (Compounding Knowledge Base) — 영구 지식 합성 및 재환류</text>

    <!-- Step 1: Raw -> LLM Synthesis -> Wiki Ingest -->
    <g transform="translate(20, 42)" filter="url(#shadow)">
      <rect width="210" height="70" rx="6" fill="#21262d" stroke="#8957e5" stroke-width="1.2"/>
      <text x="105" y="24" fill="#bc8cff" font-size="12" font-weight="600" text-anchor="middle">1. 수집 &amp; 컴파일 (Synthesis)</text>
      <text x="105" y="42" fill="#c9d1d9" font-size="11" text-anchor="middle">LLM이 원문을 읽고 정제하여</text>
      <text x="105" y="58" fill="#a371f7" font-size="10" text-anchor="middle">상호 링크된 Markdown 위키 갱신</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 230 77 L 275 77" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 2: Persistent Markdown Wiki -->
    <g transform="translate(285, 42)" filter="url(#shadow)">
      <rect width="210" height="70" rx="6" fill="#21262d" stroke="#238636" stroke-width="1.5"/>
      <text x="105" y="24" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">2. 누적 지식 저장소 (wiki/)</text>
      <text x="105" y="42" fill="#c9d1d9" font-size="11" text-anchor="middle">index.md + concepts/ + log.md</text>
      <text x="105" y="58" fill="#7ee787" font-size="10" text-anchor="middle">버전 관리 &amp; 린트(Lint) 유지</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 495 77 L 540 77" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 3: Fast Query & Feedback -->
    <g transform="translate(550, 42)" filter="url(#shadow)">
      <rect width="215" height="70" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="107" y="24" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">3. 질의 처리 및 지식 환류</text>
      <text x="107" y="42" fill="#c9d1d9" font-size="11" text-anchor="middle">잘 정돈된 개념 읽고 답변 도출</text>
      <text x="107" y="58" fill="#79c0ff" font-size="10" text-anchor="middle">새 통찰을 위키에 영구 재환류 🔄</text>
    </g>

    <!-- Feedback Arc Loop from Step 3 back to Step 2 -->
    <path d="M 657 115 C 657 155, 390 155, 390 118" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="525" y="152" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">질의 결과 및 새 결정을 wiki/syntheses 에 재환류 (Compounding Effect)</text>
  </g>
</svg>
