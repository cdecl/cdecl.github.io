<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-triage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="grad-doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <linearGradient id="grad-fix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="grad-report" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="340" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="425" y="32" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">Real-time Incident Triage &amp; Emergency Hotfix Flow</text>
  <text x="425" y="52" fill="#8b949e" font-size="12" text-anchor="middle">SRE Error Parsing (Codex) → Root Cause Analysis (RCA) → Defensive Patching (Claude Code)</text>

  <!-- Subgraph 1: Log Analysis -->
  <g transform="translate(30, 80)">
    <rect width="360" height="225" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="18" y="24" fill="#58a6ff" font-size="13" font-weight="bold">1단계: 실시간 로그 트라이아지 (SRE)</text>

    <!-- Codex SRE Node -->
    <g transform="translate(18, 45)" filter="url(#shadow)">
      <rect width="324" height="65" rx="6" fill="url(#grad-triage)" stroke="#58a6ff" stroke-width="1"/>
      <text x="162" y="26" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🛠️ Codex (triager)</text>
      <text x="162" y="44" fill="#e6edf3" font-size="11" text-anchor="middle">실시간 서버 에러 로그 파싱 &amp; 스택트레이스 분석</text>
      <text x="162" y="58" fill="#aff5b4" font-size="10" text-anchor="middle">장애 원인 규명 및 재현 페이로드 도출</text>
    </g>

    <!-- Arrow Down inside Subgraph 1 -->
    <path d="M 180 110 L 180 135" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- RCA Doc Node -->
    <g transform="translate(18, 140)" filter="url(#shadow)">
      <rect width="324" height="65" rx="6" fill="url(#grad-doc)" stroke="#f0883e" stroke-width="1.5"/>
      <text x="162" y="24" fill="#ffa657" font-size="13" font-weight="bold" text-anchor="middle">📄 RCA 분석서 ($OUT/rca.md)</text>
      <text x="162" y="42" fill="#c9d1d9" font-size="11" text-anchor="middle">• 근본 원인 (NPE / Connection Pool 고갈 등)</text>
      <text x="162" y="56" fill="#8b949e" font-size="10" text-anchor="middle">• 재현 방법 및 방어 로직 수정 제안서</text>
    </g>
  </g>

  <!-- Big Arrow: Subgraph 1 to Subgraph 2 -->
  <g transform="translate(390, 210)">
    <path d="M 5 0 L 55 0" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="30" y="-12" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">RCA 입력 주입</text>
  </g>

  <!-- Subgraph 2: Hotfix Patch -->
  <g transform="translate(455, 80)">
    <rect width="365" height="225" rx="8" fill="#161b22" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="18" y="24" fill="#f59e0b" font-size="13" font-weight="bold">2단계: 핫픽스 방어 패치 적용 (Dev)</text>

    <!-- Claude Dev Node -->
    <g transform="translate(18, 45)" filter="url(#shadow)">
      <rect width="329" height="65" rx="6" fill="url(#grad-fix)" stroke="#fcd34d" stroke-width="1"/>
      <text x="164" y="26" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">⚡ Claude Code (fixer)</text>
      <text x="164" y="44" fill="#fef3c7" font-size="11" text-anchor="middle">RCA 기반 방어 코드 패치 &amp; 단위 테스트 작성</text>
      <text x="164" y="58" fill="#fef08a" font-size="10" text-anchor="middle">컴파일 및 핫픽스 로컬 회귀 테스트 완료</text>
    </g>

    <!-- Arrow Down inside Subgraph 2 -->
    <path d="M 182 110 L 182 135" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Patch Report Node -->
    <g transform="translate(18, 140)" filter="url(#shadow)">
      <rect width="329" height="65" rx="6" fill="url(#grad-report)" stroke="#56d364" stroke-width="1.5"/>
      <text x="164" y="25" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📋 최종 패치 리포트 보고</text>
      <text x="164" y="43" fill="#aff5b4" font-size="11" text-anchor="middle">git diff 및 검증 로그를 Hermes 및 인간 엔지니어에게 보고</text>
      <text x="164" y="57" fill="#d1fae5" font-size="10" text-anchor="middle">운영 배포 준비 완료 상태</text>
    </g>
  </g>
</svg>
